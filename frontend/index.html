<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autosender — Painel</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="toastContainer"></div>

<!-- LOGIN -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="logo">⚡ Autosender</div>
    <p class="subtitle">Cole o token da conta descartável</p>
    <input type="password" id="tokenInput" placeholder="Token do Discord">
    <button class="btn-primary" onclick="validateToken()">Entrar</button>
    <p id="loginError" class="error-msg"></p>
    <p class="disclaimer">⚠️ Use uma conta descartável. Self-bots violam os ToS.</p>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="appScreen">
  <aside class="sidebar">
    <div class="brand">⚡ Autosender</div>
    <nav>
      <a class="nav-item active" data-tab="dashboard">📊 Visão Geral</a>
      <a class="nav-item" data-tab="campaigns">📢 Campanhas</a>
      <a class="nav-item" data-tab="create">➕ Nova Campanha</a>
      <a class="nav-item" data-tab="logs">📜 Logs</a>
    </nav>
    <div class="user-box" id="userBox">
      <img id="userAvatar" src="" alt="">
      <div>
        <strong id="userName">—</strong>
        <small id="userId">—</small>
      </div>
    </div>
  </aside>

  <main class="main">
    <!-- DASHBOARD -->
    <section class="tab-content active" id="tab-dashboard">
      <h2>Visão Geral</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-value" id="statCampaigns">0</span>
          <span class="stat-label">Campanhas</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statSent">0</span>
          <span class="stat-label">Mensagens enviadas</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statRunning">0</span>
          <span class="stat-label">Rodando</span>
        </div>
      </div>
      <h3>Atividade recente</h3>
      <div class="log-mini" id="dashboardLogs"></div>
    </section>

    <!-- CAMPANHAS -->
    <section class="tab-content" id="tab-campaigns">
      <h2>Campanhas</h2>
      <div id="campaignsList" class="campaigns-list"></div>
    </section>

    <!-- NOVA CAMPANHA -->
    <section class="tab-content" id="tab-create">
      <h2>Nova Campanha</h2>
      <div class="form-card">
        <label>IDs dos canais (separados por vírgula)</label>
        <input type="text" id="channelIds" placeholder="123456789, 987654321">
        <label>Mensagem</label>
        <textarea id="message" rows="4" placeholder="Texto a enviar..."></textarea>
        <div class="row">
          <div>
            <label>Delay mínimo (s)</label>
            <input type="number" id="delayMin" value="8">
          </div>
          <div>
            <label>Delay máximo (s)</label>
            <input type="number" id="delayMax" value="15">
          </div>
        </div>
        <button class="btn-primary" onclick="createCampaign()">Criar Campanha</button>
      </div>
    </section>

    <!-- LOGS -->
    <section class="tab-content" id="tab-logs">
      <div class="logs-header">
        <h2>Logs em tempo real</h2>
        <button class="btn-ghost" onclick="clearLogsUI()">Limpar</button>
      </div>
      <div class="log-viewer" id="logViewer"></div>
    </section>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
