<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://discord.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Auto Trade</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--line:#272b38;--txt:#e8eaf0;--mut:#8b90a3;--acc:#5865f2;--red:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif;padding:20px}
main{max-width:460px;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:10px;margin-top:16px}
button{flex:1;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:600;color:#fff;background:var(--acc)}
button.stop{background:var(--red)}button:disabled{opacity:.4}
#st{margin-top:14px;font-size:.9rem;color:var(--mut)}
#log{margin-top:8px;max-height:160px;overflow:auto;font:.78rem ui-monospace,monospace;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Auto Trade</h1>
<div class="card">
  <label>Token</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">
  <label>ID do canal</label>
  <input id="ch" inputmode="numeric" autocomplete="off">
  <label>Mensagem</label>
  <textarea id="msg" rows="4" maxlength="2000"></textarea>
  <div class="row">
    <div><label>Delay (s)</label><input id="delay" type="number" min="10" value="60"></div>
    <div><label>Variação (%)</label><input id="jit" type="number" min="5" max="50" value="15"></div>
    <div><label>Máx. envios</label><input id="max" type="number" min="1" value="20"></div>
  </div>
  <div class="btns">
    <button id="go">Iniciar</button>
    <button id="stop" class="stop" disabled>Parar</button>
  </div>
  <div id="st">parado</div>
  <div id="log"></div>
</div>
</main>
<script>
const kMinDelayS = 10;
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let running = false, sent = 0;

function log(t){ const d=document.createElement("div"); d.textContent=new Date().toLocaleTimeString()+" "+t; $("log").prepend(d); }
function status(t){ $("st").textContent = t + " | enviadas: " + sent; }
function setRunning(v){ running=v; $("go").disabled=v; $("stop").disabled=!v; }

async function run(cfg){
  while (running && sent < cfg.max) {
    try {
      const r = await fetch(`https://discord.com/api/v9/channels/${cfg.ch}/messages`, {
        method: "POST",
        headers: { Authorization: cfg.token, "Content-Type": "application/json" },
        body: JSON.stringify({ content: cfg.msg }),
      });
      if (r.status === 429) {
        const j = await r.json().catch(() => ({}));
        const w = Math.ceil((j.retry_after ?? 5) * 1000) + 500;
        status("rate limit, aguardando " + Math.ceil(w/1000) + "s"); log("429");
        await sleep(w); continue;
      }
      if ([401,403,404].includes(r.status)) { status("erro " + r.status + " (token, permissão ou canal)"); log("erro " + r.status); break; }
      if (r.ok) { sent++; status("enviando"); log("enviada #" + sent); }
      else { status("erro " + r.status); log("erro " + r.status); }
    } catch (e) {
      status("falha de rede/CORS"); log(String(e)); break;
    }
    const base = cfg.delay * 1000;
    await sleep(Math.max(1000, base + base * cfg.jit * (Math.random() * 2 - 1)));
  }
  setRunning(false);
  if (sent >= cfg.max) status("limite de envios atingido");
}

$("go").onclick = () => {
  const cfg = {
    token: $("token").value.trim(), ch: $("ch").value.trim(), msg: $("msg").value,
    delay: Math.max(kMinDelayS, Number($("delay").value) || 60),
    jit: Math.min(50, Math.max(5, Number($("jit").value) || 15)) / 100,
    max: Math.max(1, Number($("max").value) || 20),
  };
  if (!cfg.token || !cfg.ch || !cfg.msg) return status("preencha tudo");
  sent = 0; setRunning(true); status("iniciando"); run(cfg);
};
$("stop").onclick = () => { setRunning(false); status("parado"); };
</script>
</body>
</html>
